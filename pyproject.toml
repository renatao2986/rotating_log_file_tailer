[project]
name = "rotating-log-file-tailer"
version = "0.1.1"
description = "Reads the last N lines from a file that may be concurrently written to or rotated, reopening by path when truncation or rename is detected."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
